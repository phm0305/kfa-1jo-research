<!-- 2쪽 산업 분석 패널의 기본 화면을 그대로 옮긴 예시예요. members/industry/section.html로 복사해서 고쳐요. -->
<div data-panel="industry">
  <div class="panel-head"><h2 id="h-industry">산업 분석</h2></div>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <span class="pill" id="industry-trend"></span>
    <h3 id="industry-headline"></h3>
  </div>
  <div class="two-col">
    <div>
      <div class="small muted" id="industry-series-label"></div>
      <svg class="chart" id="industry-chart" viewBox="0 0 560 220" role="img" aria-label="분기별 업황 지표 추이"></svg>
    </div>
    <ul class="notes" id="industry-notes"></ul>
  </div>
  <script>
    const $ = (id) => root.querySelector("#" + id);
    const ind = data.industry;
    const tr = $("industry-trend");
    tr.textContent = ind.trend === "up" ? "개선 중 ▲" : ind.trend === "down" ? "꺾이는 중 ▼" : ind.trend === "flat" ? "횡보" : "확인 필요";
    tr.classList.add(ind.trend === "up" ? "up" : ind.trend === "down" ? "down" : "hold");
    $("industry-headline").textContent = ind.headline;
    $("industry-series-label").textContent = ind.series_label;
    $("industry-notes").innerHTML = ind.notes.map((n) => `<li>${ui.card(n.text, "2쪽 산업")}${ui.srcTag(n.source)}</li>`).join("");
    ui.drawLine($("industry-chart"), ind.series);
  </script>
</div>
