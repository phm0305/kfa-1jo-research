<!-- 2쪽 산업 분석을 소제목마다 제목을 달아 나눠 그리는 예시예요. members/industry/section.html로 복사해서 고쳐요.
     data.pages["2"]는 지시서 머리말의 소제목 순서 그대로예요. 빈 칸("")은 건너뛰어요. -->
<div data-panel="industry">
  <div class="panel-head"><h2 id="h-industry">산업 분석</h2></div>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <span class="pill" id="my-trend"></span>
    <h3 id="my-headline"></h3>
  </div>
  <div class="two-col">
    <div>
      <div class="small muted" id="my-series-label"></div>
      <svg class="chart" id="my-chart" viewBox="0 0 560 220" role="img" aria-label="업황 지표 추이"></svg>
    </div>
    <div id="my-sections" style="display:flex;flex-direction:column;gap:14px"></div>
  </div>
  <script>
    const $ = (id) => root.querySelector("#" + id);
    const ind = data.industry;
    const header = ["업종", "추세", "한 줄 제목"];
    const tr = $("my-trend");
    tr.textContent = ind.trend === "up" ? "개선 중 ▲" : ind.trend === "down" ? "꺾이는 중 ▼" : ind.trend === "flat" ? "횡보" : "확인 필요";
    tr.classList.add(ind.trend === "up" ? "up" : ind.trend === "down" ? "down" : "hold");
    $("my-headline").textContent = ind.headline;
    $("my-series-label").textContent = ind.series_label;
    ui.drawLine($("my-chart"), ind.series);
    $("my-sections").innerHTML = Object.entries(data.pages["2"])
      .filter(([title, text]) => !header.includes(title) && text)
      .map(([title, text]) => `<div><h3 style="margin-bottom:6px">${ui.esc(title)}</h3><ul class="notes"><li>${ui.card(text, "2쪽 산업")}</li></ul></div>`)
      .join("");
  </script>
</div>
